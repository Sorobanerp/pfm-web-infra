name: Gitflow Auto Release (GMUD)

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-gmud-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ou atualizar branch release/v0.1.0 e abrir PR de GMUD para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="release/v0.1.0"
          git checkout -B "${RELEASE_BRANCH}"
          git push -f origin "${RELEASE_BRANCH}"

          EXISTING_PR=$(gh pr list --base main --head "${RELEASE_BRANCH}" --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --title "chore(release): v0.1.0 infrastructure" \
              --body "## Solicitação de Mudança (GMUD) — Infraestrutura\n- **Origem:** \`${RELEASE_BRANCH}\`\n- **Destino:** \`main\` (Produção AWS)\n- **Blast Radius:** Isolado ao módulo deste repositório\n- **Rollback:** Revert do commit na \`main\` + \`tofu apply\`"
          else
            echo "ℹ️ PR de GMUD #${EXISTING_PR} já aberta e atualizada."
          fi
