name: Gitflow Auto Release (GMUD)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-gmud-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ou atualizar branch release/v0.1.0 e abrir PR de GMUD para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="release/v0.1.0"
          git checkout -B "${RELEASE_BRANCH}"
          git push -f origin "${RELEASE_BRANCH}"

          EXISTING_PR=$(gh pr list --base main --head "${RELEASE_BRANCH}" --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --title "chore(release): v0.1.0 pfm-web-infra" \
              --body "## Solicitacao de Mudanca (GMUD) -- pfm-web-infra"
          fi
