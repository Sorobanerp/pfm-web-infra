name: Infra OpenTofu CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação OpenTofu a executar em produção (apply ou destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [main]

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: terraform/aws
  REPO_NAME: pfm-web-infra

jobs:
  validate:
    name: fmt, validate e IaC security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt -check
        run: tofu fmt -check -recursive
      - name: tofu validate (todos os módulos/ambientes)
        run: |
          set -e
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $d"
            (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate)
            echo "::endgroup::"
          done
      - name: Install Trivy via Official APT Repository
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Gitleaks (Zero Hardcoded Secrets)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
          rm -f gitleaks
      - name: Secure-by-Design Policy Gate (RDS/SG/KMS)
        run: |
          if grep -rn --include="*.tf" "publicly_accessible[[:space:]]*=[[:space:]]*true" .; then
            echo "::error::RDS publicly_accessible = true detectado (violacao Secure by Design)"
            exit 1
          fi
      - name: Trivy config scan (IaC)
        run: trivy config --exit-code 1 --severity CRITICAL,HIGH .

  plan:
    name: tofu plan (AWS)
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Verificar variáveis do backend e garantir tabela de lock DynamoDB
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET_AWS}" --region "${AWS_REGION}"
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}" >/dev/null 2>&1 || {
            aws dynamodb create-table --table-name "${TF_LOCK_TABLE_AWS}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST --region "${AWS_REGION}"
            aws dynamodb wait table-exists --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}"
          }
      - name: tofu init (backend S3 + lock DynamoDB)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${REPO_NAME}/terraform.tfstate" \
            -backend-config="encrypt=true"
      - name: tofu plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          if aws s3api head-object --bucket "${TF_STATE_BUCKET_AWS}" --key "pfm-shared-infra/terraform.tfstate" --region "${AWS_REGION}" >/dev/null 2>&1; then
            tofu plan -input=false -no-color
          else
            echo "::notice::pfm-shared-infra/terraform.tfstate ainda não publicado no S3; OIDC, backend S3 e DynamoDB lock validados com sucesso."
          fi

  apply:
    name: tofu apply/destroy (production)
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production   # aprovação da GMUD
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Verificar variáveis do backend e garantir tabela de lock DynamoDB
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET_AWS}" --region "${AWS_REGION}"
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}" >/dev/null 2>&1 || {
            aws dynamodb create-table --table-name "${TF_LOCK_TABLE_AWS}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST --region "${AWS_REGION}"
            aws dynamodb wait table-exists --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}"
          }
      - name: Pre-Apply Backup do State Anterior no S3
        id: backup
        if: github.event.inputs.action != 'destroy'
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          if aws s3api head-object --bucket "${TF_STATE_BUCKET_AWS}" --key "${REPO_NAME}/terraform.tfstate" --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws s3 cp "s3://${TF_STATE_BUCKET_AWS}/${REPO_NAME}/terraform.tfstate" \
              "s3://${TF_STATE_BUCKET_AWS}/${REPO_NAME}/backups/terraform.tfstate.last-good" \
              --region "${AWS_REGION}"
            echo "has_backup=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Snapshot do state anterior salvo em backups/terraform.tfstate.last-good"
          else
            echo "has_backup=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Primeiro provisionamento detectado (sem state anterior no S3)"
          fi
      - name: tofu init (backend S3 + lock DynamoDB)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${REPO_NAME}/terraform.tfstate" \
            -backend-config="encrypt=true"
      - name: tofu apply
        id: apply
        if: github.event.inputs.action != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: tofu apply -auto-approve -input=false -no-color
      - name: Rollback Automático em Caso de Falha no Apply
        if: failure() && steps.apply.outcome == 'failure'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          HAS_BACKUP: ${{ steps.backup.outputs.has_backup }}
        run: |
          echo "::warning::Falha detectada no tofu apply — iniciando rollback automático..."
          if [ "${HAS_BACKUP}" = "true" ]; then
            echo "::warning::Restaurando state anterior (backups/terraform.tfstate.last-good) e revertendo terraform/ para HEAD~1..."
            aws s3 cp "s3://${TF_STATE_BUCKET_AWS}/${REPO_NAME}/backups/terraform.tfstate.last-good" \
              "s3://${TF_STATE_BUCKET_AWS}/${REPO_NAME}/terraform.tfstate" \
              --region "${AWS_REGION}"
            git checkout HEAD~1 -- terraform/ || true
            tofu apply -auto-approve -input=false -no-color || true
          else
            echo "::warning::Primeiro provisionamento com falha parcial — executando tofu destroy para evitar recursos órfãos e cobranças..."
            tofu destroy -auto-approve -input=false -no-color || true
          fi
          echo "::error::Rollback automático concluído; mantendo job em estado Failure para auditoria da GMUD."
          exit 1
      - name: tofu destroy (teardown manual sob demanda)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: tofu destroy -auto-approve -input=false -no-color
