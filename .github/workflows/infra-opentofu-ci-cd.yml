name: Infra OpenTofu CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo (dev ou prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Ação OpenTofu a executar (apply ou destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [develop, main]

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  REPO_NAME: pfm-web-infra
  STATE_PREFIX: pfm-web-infra

jobs:
  validate:
    name: fmt, validate (dev & prod) e IaC security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt -check -recursive
        run: tofu fmt -check -recursive
      - name: tofu validate (modules + environments/dev + environments/prod)
        run: |
          set -e
          for d in terraform/environments/dev terraform/environments/prod $(find terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            if [ -d "$d" ]; then
              echo "::group::validate $d"
              (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate)
              echo "::endgroup::"
            fi
          done
      - name: Install Trivy via Official APT Repository
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Gitleaks (Zero Hardcoded Secrets)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
          rm -f gitleaks
      - name: Secure-by-Design Policy Gate (RDS/SG/KMS)
        run: |
          if grep -rn --include="*.tf" "publicly_accessible[[:space:]]*=[[:space:]]*true" .; then
            echo "::error::RDS publicly_accessible = true detectado (violacao Secure by Design)"
            exit 1
          fi
      - name: Trivy config scan (IaC — dev & prod)
        run: trivy config --exit-code 1 --severity CRITICAL,HIGH .

  apply-dev:
    name: tofu apply (dev — pilot scale-to-zero)
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        id: aws_creds
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: tofu init & apply (dev)
        working-directory: terraform/environments/dev
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS || 'sorobanerp-pfm-tfstate-us-east-2-366476833548' }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          if ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::notice::Role OIDC AWS ainda não autoriza refs/heads/develop ou segredo não configurado neste runner; validação estática dev/prod concluída com sucesso."
            exit 0
          fi
          if ! aws s3api head-object --bucket "${TF_STATE_BUCKET_AWS}" --key "pfm-shared/dev/terraform.tfstate" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "::notice::pfm-shared/dev/terraform.tfstate ainda não publicado no S3; pulando apply remoto até bootstrap do shared-infra."
            exit 0
          fi
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${STATE_PREFIX}/dev/terraform.tfstate" \
            -backend-config="encrypt=true"
          tofu apply -auto-approve -input=false -no-color -var-file=terraform.tfvars

  apply-prod:
    name: tofu apply/destroy (prod — GMUD)
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: tofu init & apply (prod)
        working-directory: terraform/environments/prod
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS || 'sorobanerp-pfm-tfstate-us-east-2-366476833548' }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          if ! aws s3api head-object --bucket "${TF_STATE_BUCKET_AWS}" --key "pfm-shared/prod/terraform.tfstate" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "::notice::pfm-shared/prod/terraform.tfstate ainda não publicado no S3; pulando apply remoto até bootstrap do shared-infra."
            exit 0
          fi
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${STATE_PREFIX}/prod/terraform.tfstate" \
            -backend-config="encrypt=true"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            tofu destroy -auto-approve -input=false -no-color -var-file=terraform.tfvars
          else
            tofu apply -auto-approve -input=false -no-color -var-file=terraform.tfvars
          fi
