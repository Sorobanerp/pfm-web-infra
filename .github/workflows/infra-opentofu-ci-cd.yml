name: Infra OpenTofu CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [main]

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: terraform/aws

jobs:
  validate:
    name: fmt, validate e IaC security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt -check
        run: tofu fmt -check -recursive
      - name: tofu validate (todos os módulos/ambientes)
        run: |
          set -e
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $d"
            (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate)
            echo "::endgroup::"
          done
      - name: Install Trivy via Official APT Repository
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Trivy config scan (IaC)
        run: trivy config --exit-code 1 --severity CRITICAL,HIGH .

  plan:
    name: tofu plan (AWS)
    needs: validate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Verificar variáveis do backend e garantir tabela de lock DynamoDB
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET_AWS}" --region "${AWS_REGION}"
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}" >/dev/null 2>&1 || {
            aws dynamodb create-table --table-name "${TF_LOCK_TABLE_AWS}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST --region "${AWS_REGION}"
            aws dynamodb wait table-exists --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}"
          }
      - name: tofu init (backend S3 + lock DynamoDB)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=pfm-web-infra/terraform.tfstate" \
            -backend-config="encrypt=true"
      - name: tofu plan
        working-directory: ${{ env.TF_DIR }}
        run: tofu plan -input=false -no-color

  apply:
    name: tofu apply (production)
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # aprovação da GMUD
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Verificar variáveis do backend e garantir tabela de lock DynamoDB
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          aws s3api head-bucket --bucket "${TF_STATE_BUCKET_AWS}" --region "${AWS_REGION}"
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}" >/dev/null 2>&1 || {
            aws dynamodb create-table --table-name "${TF_LOCK_TABLE_AWS}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST --region "${AWS_REGION}"
            aws dynamodb wait table-exists --table-name "${TF_LOCK_TABLE_AWS}" --region "${AWS_REGION}"
          }
      - name: tofu init (backend S3 + lock DynamoDB)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_STATE_BUCKET_AWS: ${{ vars.TF_STATE_BUCKET_AWS }}
          TF_LOCK_TABLE_AWS: ${{ vars.TF_LOCK_TABLE_AWS || 'pfm-tfstate-locks' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
        run: |
          test -n "${TF_STATE_BUCKET_AWS}" || { echo "::error::vars.TF_STATE_BUCKET_AWS não definida"; exit 1; }
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend_override.tf
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET_AWS}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE_AWS}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=pfm-web-infra/terraform.tfstate" \
            -backend-config="encrypt=true"
      - name: tofu apply
        working-directory: ${{ env.TF_DIR }}
        run: tofu apply -auto-approve -input=false -no-color
