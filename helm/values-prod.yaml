ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 3000
  service: 80
replicaCount: 2
image:
  repository: ghcr.io/dantas-pfm/pfm-web-nextjs
  tag: "2.0.0"
service:
  port: 80
env:
  NEXT_PUBLIC_PFM_BFF_URL: "https://api.pfm.dantas.com.br"
resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"
