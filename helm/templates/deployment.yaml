apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfm-web-nextjs
  namespace: pfm-platform
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Tag imutavel v0.1.0 gerenciada pelo pipeline GitOps"
  labels:
    app: pfm-web-nextjs
    tags.datadoghq.com/service: "pfm-web-nextjs"
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/version: "0.1.0"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pfm-web-nextjs
  template:
    metadata:
      labels:
        app: pfm-web-nextjs
        tags.datadoghq.com/service: "pfm-web-nextjs"
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.serviceAccountName | default "pfm-web-nextjs-sa" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pfm-web-nextjs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.ports.container }}
              protocol: TCP
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
