apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfm-web-nextjs
  namespace: pfm-platform
  labels:
    app: pfm-web-nextjs
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pfm-web-nextjs
  template:
    metadata:
      labels:
        app: pfm-web-nextjs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: pfm-web-nextjs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
