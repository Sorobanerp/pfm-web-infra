ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 3000
  service: 80
# FinOps Minimum Footprint for 5-User Family Pilot (~US$ 8/mo GCP / ~US$ 41/mo AWS)
replicaCount: 1

image:
  repository: ghcr.io/dantas-pfm/pfm-web-nextjs
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  port: 80

env:
  NEXT_PUBLIC_PFM_BFF_URL: "https://api.pfm.dantas.com.br"

resources:
  requests:
    cpu: "50m"
    memory: "96Mi"
  limits:
    cpu: "200m"
    memory: "160Mi"
