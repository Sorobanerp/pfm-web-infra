ports:
  # container = porta de escuta do processo (env); service = porta do Service K8s
  container: 3000
  service: 80
replicaCount: 1
image:
  repository: ghcr.io/dantas-pfm/pfm-web-nextjs
  tag: "local"
service:
  port: 80
env:
  NEXT_PUBLIC_PFM_BFF_URL: "http://localhost:18080"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
